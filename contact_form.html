<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="images/header-icon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>お問い合わせ | きたむらミュージックスクール</title>
</head>
<body class="page-contact">
    <div id="container">
        <header class="header">
            <button id="js-hamburger" class="hamburger" aria-label="メニューを開く" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="header-menu">
            <nav>
                <ul>
                    <li><a href="./plan.html"><span>料金</span></a></li>
                    <li><a href="./blog_list.html"><span>ブログ</span></a></li>
                    <li><a href="./result_list.html"><span>卒業実績</span></a></li>
                </ul>
            </nav>
        </div>
        <div id="js-overlay" class="overlay"></div>
        <div class="inner">
            <div class="header__left">
                <a href="./index.html" class="header__link">
                    <div class="header__image">
                        <img src="images/header-icon.svg" alt="ヘッダーアイコン">
                    </div>
                    <div class="header__logo">きたむら<br class="pc"><span>ミュージックスクール</span></div>
                </a>
            </div>
            <nav class="header__nav pc">
                <ul>
                    <li><a href="./plan.html"><span>料金</span></a></li>
                    <li><a href="./blog_list.html"><span>ブログ</span></a></li>
                    <li><a href="./result_list.html"><span>卒業実績</span></a></li>
                    <li class="nav-contact"><a href="./contact_form.html">お問い合わせ</a></li>
                </ul>
            </nav>
        </div>
        </header>

        <main>
            <div class="main">
                <section class="fv">
                    <div class="fv__contents">
                        <div class="fv-slide__image">
                            <picture>
                                <source media="(min-width: 768px)" srcset="images/contact-pc.jpg">
                                <img src="images/contact-sp.jpg" alt="お問い合わせ">
                            </picture>
                        </div>
                        <div class="fv__catch">
                            <h1>お問い合わせ</h1>
                        </div>
                    </div>
                </section>

                <nav class="breadcrumb">
                    <div class="inner">
                        <ol class="breadcrumb__list">
                            <li class="breadcrumb__item"><a href="./index.html" class="breadcrumb__link">ホーム</a></li>
                            <li class="breadcrumb__item">お問い合わせ</li>
                        </ol>
                    </div>
                </nav>

                <section class="contact-form">
                    <div class="inner">
                        <p class="contact-form__intro">当校に関するご質問・ご相談・資料請求は下記のフォームからお気軽にお問い合わせください。<br>通常３営業日以内にメールにてご連絡させていただきます。</p>

                        <form class="contact-form__form" action="./contact_send.html" method="get">
                            <div class="contact-form__row">
                                <label class="contact-form__label" for="company">会社名</label>
                                <div class="contact-form__input-wrap">
                                    <input type="text" id="company" name="company" placeholder="きたむらミュージックスクール">
                                </div>
                            </div>

                            <div class="contact-form__row">
                                <label class="contact-form__label" for="name">お名前</label>
                                <div class="contact-form__input-wrap">
                                    <input type="text" id="name" name="name" placeholder="北村　翔平">
                                </div>
                            </div>

                            <div class="contact-form__row">
                                <label class="contact-form__label" for="email">メールアドレス</label>
                                <div class="contact-form__input-wrap">
                                    <input type="email" id="email" name="email" placeholder="info@kitamura.musicschool.jp">
                                </div>
                            </div>

                            <div class="contact-form__row">
                                <label class="contact-form__label" for="tel">電話番号</label>
                                <div class="contact-form__input-wrap">
                                    <input type="tel" id="tel" name="tel" placeholder="090-1234-5678">
                                </div>
                            </div>

                            <div class="contact-form__row">
                                <div class="contact-form__label">目　的　<span class="contact-form__label-note">(複数選択可)</span></div>
                                <div class="contact-form__input-wrap">
                                    <div class="contact-form__checkboxes">
                                        <label class="contact-form__checkbox">
                                            <input type="checkbox" name="purpose" value="plan">
                                            プランについてのお問い合わせ
                                        </label>
                                        <label class="contact-form__checkbox">
                                            <input type="checkbox" name="purpose" value="hearing">
                                            ヒアリングのご予約
                                        </label>
                                        <label class="contact-form__checkbox">
                                            <input type="checkbox" name="purpose" value="material">
                                            資料請求
                                        </label>
                                        <label class="contact-form__checkbox">
                                            <input type="checkbox" name="purpose" value="other">
                                            その他
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="contact-form__row">
                                <label class="contact-form__label" for="message">内　容</label>
                                <div class="contact-form__input-wrap">
                                    <textarea id="message" name="message" placeholder="内容に関する詳細や備考等をご入力ください。"></textarea>
                                </div>
                            </div>

                            <div class="contact-form__submit">
                                <button type="submit">送信</button>
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </main>

        <a href="#" id="js-pagetop" class="pagetop" aria-label="ページトップへ戻る">
            <img src="images/top-icon.svg" alt="ページトップへ戻る">
        </a>

        <footer class="footer">
            <div class="footer__nav">
                <nav class="footer__nav-link">
                    <ul>
                        <li><a href="./index.html">ホーム</a></li>
                        <li><a href="./plan.html"><span>料金</span></a></li>
                        <li><a href="./blog_list.html"><span>ブログ</span></a></li>
                        <li><a href="./result_list.html"><span>卒業実績</span></a></li>
                    </ul>
                </nav>
            </div>
            <a href="./index.html" class="footer__image">
                <img src="images/footer-icon.svg" alt="フッターアイコン">
            </a>
            <div class="footer__copyright">
                <p class="copyright">Copyright © 0000 KITAMURA music school Inc. <br class="sp">All Rights</p>
            </div>
            <div class="footer__sns">
                <ul>
                    <li><a href="#" class="sns-icon" target="_blank" rel="noopener noreferrer"><img src="images/twitter.svg" alt="twitter"></a></li>
                    <li><a href="#" class="sns-icon" target="_blank" rel="noopener noreferrer"><img src="images/facebook.svg" alt="facebook"></a></li>
                    <li><a href="#" class="sns-icon" target="_blank" rel="noopener noreferrer"><img src="images/youtube.svg" alt="youtube"></a></li>
                    <li><a href="#" class="sns-icon" target="_blank" rel="noopener noreferrer"><img src="images/instagram.svg" alt="instagram"></a></li>
                </ul>
            </div>
        </footer>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
